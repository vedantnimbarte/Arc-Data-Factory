[project]
name = "arc-data-factory"
version = "0.1.0"
description = "Production-grade AI training-data platform for ARC models."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "ray>=2.40",
    "boto3>=1.35",
    "aioboto3>=13.2",
    "pyarrow>=18.0",
    "polars>=1.17",
    "datasketch>=1.6",          # MinHash / LSH
    "tokenizers>=0.21",          # HuggingFace tokenizers
    "tree-sitter>=0.23",
    "tree-sitter-languages>=1.10",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "httpx>=0.28",
    "tenacity>=9.0",             # retry/backoff
    "presidio-analyzer>=2.2",    # PII detection (compliance)
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "factory-boy>=3.3",
    "moto[s3]>=5.0",            # mock S3 for tests
    "fakeredis>=2.26",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=arc --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "TID"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["arc*"]
